name: Python application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:

    - uses: actions/checkout@v2
      with:
        # chk_related_integrity.py diffs against the base branch, so it needs
        # more than the default single-commit checkout.
        fetch-depth: 0

    - name: Set up Python ${{matrix.python-version}}
      uses: actions/setup-python@v2
      with:
        python-version: ${{matrix.python-version}}

    - name: Initialize submodules
      run: git submodule update --init --recursive

    - name: Install system dependencies
      run: sudo apt install jq moreutils

    - name: Validate files
      run: ./validate_all.sh

    - name: Check related dest-uuid integrity
      run: |
        # GITHUB_BASE_REF is set by Actions on pull_request and holds the base
        # branch name; it is not attacker-controlled text interpolated into the
        # script. On push it is empty, so fall back to the default branch.
        base="${GITHUB_BASE_REF:-main}"
        git fetch --no-tags --depth=1 origin "$base"
        python3 tools/chk_related_integrity.py --baseline FETCH_HEAD

    - name: Install Python dependencies
      run: python -m pip install poetry

    - name: Install testing via python module
      run: |
        git clone https://github.com/MISP/PyMISPGalaxies.git
        pushd PyMISPGalaxies
        git submodule update --init
        git submodule foreach git pull origin main
        poetry install
        popd
        sudo mount --bind . PyMISPGalaxies/pymispgalaxies/data/misp-galaxy

    - name: Test with Python module
      run: |
        pushd PyMISPGalaxies
        poetry run pytest --cov=pymispgalaxies  tests/tests.py
        popd

    - name: Test updated README.md
      run: |
        pushd tools
        python3 update_README_with_index.py
        git diff --exit-code ../README.md
        popd
